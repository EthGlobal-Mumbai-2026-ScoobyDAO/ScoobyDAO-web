name: Web checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # Build generates Next.js route declarations for the standalone typecheck.
      - run: npm run build
      - run: npm run typecheck
